name: Business cycle acceptance
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/**'
      - 'acceptance/**'
      - 'tests/helpers/business-cycle.cjs'
      - '.github/workflows/business-cycle-acceptance.yml'
      - 'package*.json'
jobs:
  cycle:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: timeout --kill-after=15s 360s node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/3 acceptance/*.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-cycle-screenshots-${{ matrix.shard }}
          path: |
            test-results/business-cycle*.png
            test-results/multiuser*.png
            test-results/periods*.png
            test-results/tax-*.png
          if-no-files-found: ignore
