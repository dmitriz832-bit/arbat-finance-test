name: FinTablo responsive UI
on:
  pull_request:
    paths:
      - 'app/**'
      - 'e2e/fintablo-layout.cjs'
      - 'package.json'
      - '.github/workflows/fintablo-ui.yml'
  workflow_dispatch:
jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Upload diagnostic artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fintablo-ui-diagnostics
          path: test-results/
          if-no-files-found: ignore
