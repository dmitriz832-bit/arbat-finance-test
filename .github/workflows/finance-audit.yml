name: Finance audit tests
on:
  push:
    branches:
      - audit/ledger-invariants-20261021
  pull_request:
    paths:
      - 'app/finance-core.js'
      - 'tests/**'
      - '.github/workflows/finance-audit.yml'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node test suite
        run: npm test
