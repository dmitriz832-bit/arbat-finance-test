name: Finance core validation
on:
  push:
    branches: [main, audit/finance-core-20261017]
  pull_request:
    paths:
      - 'app/**'
      - 'app/finance-core.js'
      - 'app/payables*'
      - 'app/vat-forms.js'
      - 'tests/vat*.cjs'
      - 'tests/finance*.cjs'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app/index.html'
      - 'app/dashboard.js'
      - 'app/business-system.js'
      - '.github/workflows/finance-core-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/finance-core.js
      - run: node --test tests/*.cjs
  browser:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: timeout --kill-after=15s 300s node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/3 e2e/*.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-browser-screenshots-${{ matrix.shard }}
          path: test-results/**/*.png
          if-no-files-found: ignore
