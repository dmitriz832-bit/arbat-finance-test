name: Finance core validation
on:
  push:
    branches: [main, audit/finance-core-20261017]
  pull_request:
    paths:
      - 'app/finance-core.js'
      - 'app/vat-forms.js'
      - 'tests/vat*.cjs'
      - 'tests/finance*.cjs'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app/index.html'
      - 'app/dashboard.js'
      - 'app/business-system.js'
      - '.github/workflows/finance-core-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/finance-core.js
      - run: node --test tests/*.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: timeout --kill-after=15s 180s node e2e/payables.cjs
      - run: timeout --kill-after=15s 300s npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
