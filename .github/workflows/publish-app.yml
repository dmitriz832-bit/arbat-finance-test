name: Validate ARBAT FINANCE source
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/publish-app.yml'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify warehouse regression cases
        run: node --test tests/warehouse-regression.cjs
      - name: Check JavaScript syntax
        run: |
          for file in app/*.js; do node --check "$file"; done
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('app/index.html','utf8');
          for (const [,attrs,code] of html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)) {
            if (!/\bsrc=/.test(attrs)) new Function(code);
          }
          JS
