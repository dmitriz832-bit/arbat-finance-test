name: Atomic shared-state PostgreSQL validation
on:
  push:
    branches: [main, audit/finance-core-20261017]
  pull_request:
    paths:
      - 'app/sync.js'
      - 'app/finance-core.js'
      - 'app/index.html'
      - 'app/management-review*.js'
      - 'app/tax-document-fields.js'
      - 'app/tax-register-model.js'
      - 'app/tax-registers.js'
      - 'supabase/migrations/*tax_recognition_period_guard.sql'
      - 'tests/tax-recognition-periods.sql'
      - 'tests/tax-event-registers.sql'
      - 'tests/financial-workspace-guards.sql'
      - 'supabase/migrations/*financial_workspace_guards.sql'
      - 'supabase/migrations/*tax_event_registers.sql'
      - 'supabase/migrations/*atomic_shared_state_batch.sql'
      - 'tests/atomic-shared-state-batch.sql'
      - '.github/workflows/atomic-shared-state-tests.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: postgres:16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atomic_batch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify real PostgreSQL transaction rollback and RPC permissions
        env:
          PGPASSWORD: isolated-ci-only
        run: psql -h postgres -U postgres -d atomic_batch_test -v ON_ERROR_STOP=1 -f tests/atomic-shared-state-batch.sql

      - name: Verify tax recognition months and receipt deductions respect closed periods
        env:
          PGPASSWORD: isolated-ci-only
        run: psql -h postgres -U postgres -d atomic_batch_test -v ON_ERROR_STOP=1 -f tests/tax-recognition-periods.sql

      - name: Verify explicit tax register periods and audit
        env:
          PGPASSWORD: isolated-ci-only
        run: psql -h postgres -U postgres -d atomic_batch_test -v ON_ERROR_STOP=1 -f tests/tax-event-registers.sql

      - name: Verify financial workspaces protect linked months and approvals
        env:
          PGPASSWORD: isolated-ci-only
        run: psql -h postgres -U postgres -d atomic_batch_test -v ON_ERROR_STOP=1 -f tests/financial-workspace-guards.sql
