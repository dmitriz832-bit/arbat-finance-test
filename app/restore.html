<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Восстановление ARBAT FINANCE</title><style>body{font:16px system-ui;background:#f2f5f9;color:#172337;margin:0;padding:32px}main{max-width:600px;margin:50px auto;background:white;border-radius:18px;padding:28px;box-shadow:0 8px 36px #0012}button,input{font:inherit;padding:13px;border:1px solid #cdd6df;border-radius:8px}button{cursor:pointer;background:#116e60;color:white;border:0}button:disabled{opacity:.5}p{line-height:1.55}#status{white-space:pre-wrap}</style></head><body><main><h2>Восстановление справочников ARBAT FINANCE</h2><p>Здесь можно один раз перенести исходный JSON в общую базу. Доступно только администратору. Склад не меняется.</p><p>Выберите первоначальный файл <b>arbat-finance-demo.json</b>.</p><input type="file" id="file" accept=".json,application/json"><p><button id="restore" disabled>Проверить и восстановить</button></p><p id="status">Ожидание файла.</p><a href="./">Вернуться в приложение</a></main><script>(()=>{const base='https://albkplrjiksydkjkivlm.supabase.co',key='sb_publishable_GJgjkhRNhlWRbjUJGAo8AA_JM6-D90C',file=document.getElementById('file'),button=document.getElementById('restore'),msg=document.getElementById('status');let data=null;file.onchange=async()=>{button.disabled=true;try{data=JSON.parse(await file.files[0].text());const counts={people:11,crews:3,wallets:8,articles:53,priceCatalog:1481};for(const [k,n]of Object.entries(counts))if(!Array.isArray(data[k])||data[k].length!==n)throw Error('В файле неверное количество записей: '+k);msg.textContent='Файл проверен. Найдено: 11 сотрудников, 3 бригады, 8 счетов, 53 статьи, 1481 позиция прайса. Готово к восстановлению.';button.disabled=false}catch(e){msg.textContent='Ошибка файла: '+e.message}};button.onclick=async()=>{button.disabled=true;try{const session=JSON.parse(localStorage.getItem('arbat-session-v1')||'null');if(!session?.access_token)throw Error('Сначала войдите в приложение на этом адресе под администратором.');if(session.expires_at&&Date.now()/1000>=session.expires_at-60)throw Error('Время сессии истекло. Повторно войдите в ARBAT FINANCE.');msg.textContent='Восстанавливаем данные на сервере…';const r=await fetch(base+'/rest/v1/rpc/restore_initial_finance',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({p_payload:data})}),value=await r.json().catch(()=>({}));if(!r.ok)throw Error(value.message||value.error||'HTTP '+r.status);msg.textContent='Готово. Финансовые справочники перенесены, версия '+value+'. Вернитесь в приложение и обновите страницу.'}catch(e){msg.textContent='Восстановление не выполнено: '+e.message;button.disabled=false}}})();</script></body></html>
